<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="전남 국립의대 설립 | 순천갑 국회의원 김문수">
  <title>전남에는 의대가 없다 | 순천갑 김문수</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700;900&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">

  <style>
    /* ===== RESET ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      line-height: 1.7;
      overflow-x: hidden;
    }
    img { max-width: 100%; display: block; }
    a { color: inherit; text-decoration: none; }

    /* ===== CSS VARIABLES ===== */
    :root {
      --bg:      #0D1B2A;
      --bg2:     #112233;
      --bg3:     #080f18;
      --red:     #E63946;
      --gold:    #F4A261;
      --text:    #E8E8E8;
      --muted:   #B0B8C1;
      --border:  rgba(255,255,255,0.07);
      --serif:   'Noto Serif KR', serif;
      --sans:    'Noto Sans KR', sans-serif;
    }

    /* ===== PLACEHOLDER SECTIONS (will be filled in next steps) ===== */
    nav      { min-height: 64px;  background: rgba(13,27,42,0.9); display:flex; align-items:center; padding: 0 2rem; position:fixed; top:0; width:100%; z-index:100; }
    #hero    { min-height: 100vh; background: var(--bg);  display:flex; align-items:center; justify-content:center; padding-top:64px; }
    #stats   { min-height: 40vh;  background: var(--bg3); padding: 5rem 2rem; }
    #problem { min-height: 40vh;  background: var(--bg);  padding: 5rem 2rem; }
    #chart   { min-height: 40vh;  background: var(--bg3); padding: 5rem 2rem; }
    #solution{ min-height: 40vh;  background: var(--bg2); padding: 5rem 2rem; }
    #effects { min-height: 40vh;  background: var(--bg);  padding: 5rem 2rem; }
    #pledge  { min-height: 40vh;  background: var(--bg3); padding: 5rem 2rem; }
    footer   { min-height: 20vh;  background: #050e18;    padding: 3rem 2rem; }

    /* ===== TEMP LABELS ===== */
    .temp-label {
      font-family: var(--serif);
      font-size: 2rem;
      color: var(--muted);
      text-align: center;
      opacity: 0.3;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <nav><span style="color:var(--muted); font-size:.85rem;">NAV — 순천갑 김문수</span></nav>

  <section id="hero">    <p class="temp-label">HERO</p>   </section>
  <section id="stats">   <p class="temp-label">STATS</p>  </section>
  <section id="problem"> <p class="temp-label">PROBLEM</p></section>
  <section id="chart">   <p class="temp-label">CHART</p>  </section>
  <section id="solution"><p class="temp-label">SOLUTION</p></section>
  <section id="effects"> <p class="temp-label">EFFECTS</p></section>
  <section id="pledge">  <p class="temp-label">PLEDGE</p> </section>
  <footer>               <p class="temp-label">FOOTER</p> </footer>

</body>
</html>
