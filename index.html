<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="전남 국립의대 설립 | 순천갑 국회의원 김문수">
  <title>전남에는 의대가 없다 | 순천갑 김문수</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700;900&family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">

  <!-- Three.js -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.min.js"></script>

  <style>
    /* ── RESET ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      line-height: 1.7;
      overflow-x: hidden;
      cursor: none; /* custom cursor */
    }
    @media (hover: none) { body { cursor: auto; } }
    img { max-width: 100%; display: block; }
    a { color: inherit; text-decoration: none; }

    /* ── DESIGN TOKENS ── */
    :root {
      --bg:      #03060d;
      --bg2:     #070d1a;
      --bg3:     #0a1525;
      --panel:   rgba(10,21,37,0.85);
      --red:     #ff2d3b;
      --gold:    #ffaa55;
      --cyan:    #00d4ff;
      --purple:  #7b2fff;
      --text:    #e8edf5;
      --muted:   #7a8899;
      --border:  rgba(255,255,255,0.06);
      --glow-r:  rgba(255,45,59,0.35);
      --glow-c:  rgba(0,212,255,0.25);
      --serif:   'Noto Serif KR', serif;
      --sans:    'Noto Sans KR', sans-serif;
    }

    /* ── KEYFRAMES ── */
    @keyframes fadeUp     { from{opacity:0;transform:translateY(28px)} to{opacity:1;transform:none} }
    @keyframes fadeIn     { from{opacity:0} to{opacity:1} }
    @keyframes blink      { 0%,100%{opacity:1} 50%{opacity:0} }
    @keyframes bounce     { 0%,100%{transform:translateY(0)rotate(45deg)} 50%{transform:translateY(8px)rotate(45deg)} }
    @keyframes glow       { 0%,100%{opacity:.2} 50%{opacity:.5} }
    @keyframes spin       { to{transform:rotate(360deg)} }
    @keyframes charIn     { from{opacity:0;transform:translateY(22px)} to{opacity:1;transform:none} }
    @keyframes scanLine   { from{top:-2px} to{top:100%} }
    @keyframes hueShift   { to{filter:hue-rotate(360deg)} }
    @keyframes borderFlow {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* ── SCROLL REVEAL ── */
    .reveal, .reveal-up, .reveal-left, .reveal-right {
      opacity: 0;
      transition: opacity .8s ease, transform .8s ease;
    }
    .reveal-up    { transform: translateY(40px); }
    .reveal-left  { transform: translateX(-40px); }
    .reveal-right { transform: translateX(40px); }
    .reveal.visible, .reveal-up.visible,
    .reveal-left.visible, .reveal-right.visible {
      opacity: 1; transform: none;
    }

    /* ── SHARED ── */
    .inner { max-width: 1240px; margin: 0 auto; padding: 0 2rem; }
    .label {
      display: inline-flex; align-items: center; gap: .6rem;
      font-size: .7rem; font-weight: 700; letter-spacing: .2em;
      text-transform: uppercase; color: var(--cyan);
      margin-bottom: 1rem;
    }
    .label::before { content:''; width:20px; height:1px; background:var(--cyan); }
    .section-title {
      font-family: var(--serif);
      font-size: clamp(1.9rem, 4vw, 3.2rem);
      font-weight: 900; line-height: 1.2;
      margin-bottom: 1.2rem;
    }
    .section-desc { color: var(--muted); max-width: 560px; line-height: 1.8; }

    /* placeholder sections — filled next steps */
    #preloader, nav, #hero, #stats, #problem,
    #chart, #solution, #effects, #pledge, footer {
      position: relative;
    }
    #stats, #problem, #chart, #solution,
    #effects, #pledge { padding: 7rem 0; }
    footer { padding: 4rem 0 2rem; }
  </style>
</head>
<body>

  <!-- sections inserted in next steps -->
  <div id="preloader" style="position:fixed;inset:0;background:#03060d;display:flex;align-items:center;justify-content:center;z-index:9999;font-family:'Noto Sans KR',sans-serif;">
    <span style="font-size:clamp(3rem,8vw,6rem);font-weight:700;color:#ff2d3b;letter-spacing:.05em" id="loader-num">0</span>
  </div>

  <nav id="nav" style="position:fixed;top:0;left:0;right:0;z-index:200;height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 2.5rem;transition:background .4s,backdrop-filter .4s">
    <span style="font-family:'Noto Serif KR',serif;font-weight:700;font-size:1.05rem">순천갑 김문수</span>
    <span style="font-size:.75rem;color:#7a8899">더불어민주당</span>
  </nav>

  <section id="hero" style="min-height:100vh;background:#03060d"></section>
  <section id="stats"   style="background:#070d1a"><p style="color:#7a8899;text-align:center">STATS — 다음</p></section>
  <section id="problem" style="background:#03060d"><p style="color:#7a8899;text-align:center">PROBLEM — 다음</p></section>
  <section id="chart"   style="background:#070d1a"><p style="color:#7a8899;text-align:center">CHART — 다음</p></section>
  <section id="solution"style="background:#0a1525"><p style="color:#7a8899;text-align:center">SOLUTION — 다음</p></section>
  <section id="effects" style="background:#03060d"><p style="color:#7a8899;text-align:center">EFFECTS — 다음</p></section>
  <section id="pledge"  style="background:#070d1a"><p style="color:#7a8899;text-align:center">PLEDGE — 다음</p></section>
  <footer               style="background:#020509"><p style="color:#7a8899;text-align:center">FOOTER — 다음</p></footer>

  <script>
    // ── PRELOADER (Step 1 preview) ──
    (function() {
      const el = document.getElementById('loader-num');
      let n = 0;
      const iv = setInterval(() => {
        n += Math.random() * 12 + 1;
        if (n >= 100) {
          n = 100;
          clearInterval(iv);
          setTimeout(() => {
            const pl = document.getElementById('preloader');
            pl.style.transition = 'clip-path .9s cubic-bezier(.76,0,.24,1)';
            pl.style.clipPath = 'inset(0 0 100% 0)';
            setTimeout(() => pl.remove(), 950);
          }, 300);
        }
        el.textContent = Math.floor(n);
      }, 28);
    })();
  </script>
</body>
</html>
